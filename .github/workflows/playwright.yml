name: Playwright Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to run tests on'
        required: true
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit
      mobile:
        description: 'Mobile device emulation'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - 'iPhone 15'
          - 'iPad (gen 11)'
          - 'iPad (gen 7)'

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    env:
      BROWSER: ${{ github.event.inputs.browser || 'chromium' }}
      MOBILE: ${{ github.event.inputs.mobile || 'none' }}
      HEADLESS: 'TRUE'
      BASE_URL: ${{ secrets.BASE_URL }}
      VIEWPORT_WIDTH: '1280'
      VIEWPORT_HEIGHT: '720'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps ${{ env.BROWSER }}

      - name: Run tests
        run: pytest --html=report.html --self-contained-html

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: report.html
          retention-days: 30
